<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Powerspaces — make macOS Spaces work like real virtual desktops">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C66FA"/>
      <stop offset="1" stop-color="#5733CC"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#0a1120"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="#1e2b4a"/>

  <!-- Logo: the app icon (violet squircle + power-window glyph) -->
  <g transform="translate(64,110)" filter="url(#soft)">
    <rect x="0" y="0" width="152" height="152" rx="36" fill="url(#violet)"/>
    <rect x="32" y="32" width="88" height="88" rx="12" fill="none" stroke="#fff" stroke-width="5.5"/>
    <line x1="32" y1="51" x2="120" y2="51" stroke="#fff" stroke-width="4.5"/>
    <path d="M82.3 61.9 L65.4 82.0 L76.7 82.0 L69.7 100.7 L87.3 77.8 L76.0 77.8 Z" fill="#fff"/>
  </g>

  <!-- Eyebrow, wordmark, tagline -->
  <text x="250" y="116" font-family="'JetBrains Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="500" letter-spacing="1.6" fill="#6f9dff">MACOS · MENU-BAR APP</text>
  <text x="248" y="170" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#e8edf6">Powerspaces</text>
  <text x="250" y="210" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#aebbd4">Make macOS Spaces work like real virtual desktops.</text>

  <!-- Fact pills (site icon-chip style) -->
  <g font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500">
    <g transform="translate(250,238)">
      <rect width="172" height="34" rx="8" fill="#0e1730" stroke="#1e3a5e"/>
      <text x="16" y="22" fill="#6f9dff">⌥</text>
      <text x="36" y="22" fill="#a9b6cf">Augments Spaces</text>
    </g>
    <g transform="translate(434,238)">
      <rect width="176" height="34" rx="8" fill="#0e1730" stroke="#1e3a5e"/>
      <text x="16" y="22" fill="#6f9dff">⌂</text>
      <text x="36" y="22" fill="#a9b6cf">No SIP, no kexts</text>
    </g>
    <g transform="translate(622,238)">
      <rect width="180" height="34" rx="8" fill="#0e1730" stroke="#1e3a5e"/>
      <text x="16" y="22" fill="#6f9dff">✓</text>
      <text x="36" y="22" fill="#a9b6cf">Per-desktop dock</text>
    </g>
  </g>

  <!-- Right: a display showing three isolated desktops, #2 is current -->
  <g filter="url(#soft)">
    <rect x="884" y="104" width="252" height="172" rx="16" fill="#0c1322" stroke="#1e2b4a"/>
  </g>
  <g font-family="'JetBrains Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="500">
    <!-- tile 1 -->
    <rect x="904" y="124" width="62" height="120" rx="7" fill="#0e1730" stroke="#1e2b4a"/>
    <circle cx="920" cy="142" r="6" fill="#FF9F0A"/><circle cx="942" cy="142" r="6" fill="#34C759"/>
    <circle cx="920" cy="162" r="6" fill="#5C8FFC"/>
    <text x="935" y="236" fill="#5f7196" text-anchor="middle">1</text>
    <!-- tile 2 (current) -->
    <rect x="978" y="124" width="62" height="120" rx="7" fill="#13223f" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="994" cy="142" r="6" fill="#FF3B30"/><circle cx="1016" cy="142" r="6" fill="#5C8FFC"/>
    <circle cx="994" cy="162" r="6" fill="#AF52DE"/><circle cx="1016" cy="162" r="6" fill="#34C759"/>
    <text x="1009" y="236" fill="#6f9dff" text-anchor="middle">2·now</text>
    <!-- tile 3 -->
    <rect x="1052" y="124" width="62" height="120" rx="7" fill="#0e1730" stroke="#1e2b4a"/>
    <circle cx="1068" cy="142" r="6" fill="#5AC8FA"/><circle cx="1090" cy="142" r="6" fill="#FF9F0A"/>
    <text x="1083" y="236" fill="#5f7196" text-anchor="middle">3</text>
  </g>
</svg>
