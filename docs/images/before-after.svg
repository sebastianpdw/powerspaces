<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Before and after: without Powerspaces you get yanked to another desktop; with Powerspaces the app opens on the desktop you're on">
  <defs>
    <linearGradient id="wpA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2233"/><stop offset="1" stop-color="#3a2b35"/></linearGradient>
    <linearGradient id="wpB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2253"/><stop offset="1" stop-color="#282c6a"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1000" height="470" rx="16" fill="#0a1120"/>
  <rect x="0.5" y="0.5" width="999" height="469" rx="15.5" fill="none" stroke="#1e2b4a"/>

  <!-- ============ LEFT: WITHOUT ============ -->
  <g filter="url(#sh)"><rect x="24" y="24" width="452" height="422" rx="18" fill="#0e1730" stroke="#3a2436"/></g>
  <text x="48" y="60" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#e58fa0">Without Powerspaces</text>
  <text x="48" y="84" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a9b6cf">You click the Chat app — it lives on Desktop 1…</text>

  <!-- yank arrow (Desktop 2 -> Desktop 1), in the band above the desktops -->
  <path d="M300 150 C250 106 180 106 152 148" fill="none" stroke="#e58fa0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M152 150 l13 -1 l-9 -8 z" fill="#e58fa0"/>
  <g transform="translate(226,112)"><rect x="-40" y="-15" width="80" height="30" rx="15" fill="#e58fa0"/><text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" letter-spacing="1.2" fill="#fff">YANK!</text></g>

  <!-- Desktop 1 (gets the focus = yanked here) -->
  <g transform="translate(48,150)">
    <rect width="186" height="118" rx="10" fill="url(#wpA)" stroke="#e58fa0" stroke-width="3"/>
    <text x="10" y="22" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#d9b58c">Desktop 1</text>
    <rect x="40" y="36" width="106" height="58" rx="8" fill="#0e1730" stroke="#1e2b4a"/>
    <rect x="40" y="36" width="106" height="15" rx="8" fill="#16B5A6"/><rect x="40" y="44" width="106" height="7" fill="#16B5A6"/>
    <circle cx="51" cy="43" r="3" fill="#fff"/>
    <text x="93" y="80" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#16B5A6">Chat</text>
  </g>
  <!-- Desktop 2 (where you started) -->
  <g transform="translate(266,150)">
    <rect width="186" height="118" rx="10" fill="url(#wpB)" opacity="0.8"/>
    <text x="10" y="22" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#b9b0e8">Desktop 2 · you were here</text>
    <rect x="33" y="84" width="120" height="26" rx="9" fill="#050912" opacity="0.82"/>
    <rect x="42" y="90" width="14" height="14" rx="4" fill="#5C8FFC"/>
    <rect x="62" y="90" width="14" height="14" rx="4" fill="#16B5A6"/>
    <rect x="82" y="90" width="14" height="14" rx="4" fill="#FF9F0A"/>
    <rect x="102" y="90" width="14" height="14" rx="4" fill="#AF52DE"/>
    <g transform="translate(64,97)" fill="#050912" stroke="#fff" stroke-width="1.2"><path d="M0,0 L0,16 L4.2,12 L7,18 L9.2,17 L6.5,11 L12,11 Z"/></g>
  </g>

  <g transform="translate(48,300)">
    <rect width="404" height="80" rx="12" fill="#221a2c"/>
    <text x="22" y="34" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#e58fa0">macOS teleports you to Desktop 1.</text>
    <text x="22" y="58" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b98a9b">Your work on Desktop 2 vanishes from view.</text>
  </g>

  <!-- ============ RIGHT: WITH ============ -->
  <g filter="url(#sh)"><rect x="524" y="24" width="452" height="422" rx="18" fill="#0e1730" stroke="#1e3a5e"/></g>
  <text x="548" y="60" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#6f9dff">With Powerspaces</text>
  <text x="548" y="84" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a9b6cf">You click the Chat app from Desktop 2…</text>

  <!-- opens-here indicator into Desktop 2 -->
  <g transform="translate(859,112)"><rect x="-56" y="-15" width="112" height="30" rx="15" fill="#3b82f6"/><text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono','JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#fff">OPENS HERE</text></g>
  <path d="M859 128 V146" stroke="#6f9dff" stroke-width="3" stroke-linecap="round"/>
  <path d="M859 150 l5 -9 l-10 0 z" fill="#6f9dff"/>

  <!-- Desktop 1 (untouched) -->
  <g transform="translate(548,150)">
    <rect width="186" height="118" rx="10" fill="url(#wpA)" opacity="0.5"/>
    <text x="10" y="22" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#d9b58c">Desktop 1</text>
    <rect x="40" y="36" width="106" height="58" rx="8" fill="#0e1730" stroke="#1e2b4a" opacity="0.7"/>
    <text x="93" y="70" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#16B5A6" opacity="0.8">Chat</text>
  </g>
  <!-- Desktop 2 (stays current, new Chat window opens here) -->
  <g transform="translate(766,150)">
    <rect width="186" height="118" rx="10" fill="url(#wpB)" stroke="#6f9dff" stroke-width="3"/>
    <text x="10" y="22" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#b9b0e8">Desktop 2 · you stay here</text>
    <rect x="40" y="32" width="106" height="52" rx="8" fill="#0e1730" stroke="#6f9dff" stroke-width="1.5"/>
    <rect x="40" y="32" width="106" height="15" rx="8" fill="#16B5A6"/><rect x="40" y="40" width="106" height="7" fill="#16B5A6"/>
    <circle cx="51" cy="39" r="3" fill="#fff"/>
    <text x="93" y="70" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#16B5A6">Chat (new)</text>
    <rect x="33" y="92" width="120" height="22" rx="8" fill="#050912" opacity="0.82"/>
    <rect x="42" y="96" width="14" height="14" rx="4" fill="#5C8FFC"/>
    <rect x="62" y="96" width="14" height="14" rx="4" fill="#16B5A6"/>
    <rect x="82" y="96" width="14" height="14" rx="4" fill="#FF9F0A"/>
    <g transform="translate(64,103)" fill="#050912" stroke="#fff" stroke-width="1.2"><path d="M0,0 L0,16 L4.2,12 L7,18 L9.2,17 L6.5,11 L12,11 Z"/></g>
  </g>

  <g transform="translate(548,300)">
    <rect width="404" height="80" rx="12" fill="#13223f"/>
    <text x="22" y="34" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#6f9dff">A new window opens on Desktop 2.</text>
    <text x="22" y="58" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b6cf">You never leave the desktop you're working on.</text>
  </g>
</svg>
