<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Smart-launch decision: focus here, launch here, or open a new window here — never jump away">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8ef8"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="920" height="520" rx="16" fill="#0a1120"/>
  <rect x="0.5" y="0.5" width="919" height="519" rx="15.5" fill="none" stroke="#1e2b4a"/>

  <!-- Start node -->
  <g filter="url(#sh)">
    <rect x="350" y="28" width="220" height="58" rx="14" fill="url(#blue)"/>
  </g>
  <text x="460" y="64" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">You open an app</text>

  <!-- connectors -->
  <g fill="none" stroke="#2a3a5e" stroke-width="2.5">
    <path d="M460 86 V120 H160 V172"/>
    <path d="M460 120 V172"/>
    <path d="M460 86 V120 H760 V172"/>
  </g>

  <!-- Card A: focus -->
  <g filter="url(#sh)"><rect x="34" y="174" width="252" height="296" rx="16" fill="#0e1730"/></g>
  <rect x="34" y="174" width="252" height="50" rx="16" fill="#13223f"/>
  <rect x="34" y="208" width="252" height="16" fill="#13223f"/>
  <text x="160" y="205" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6f9dff">Has a window HERE?</text>
  <!-- mini desktop with app present -->
  <rect x="74" y="246" width="172" height="104" rx="9" fill="#0c1322" stroke="#1e2b4a"/>
  <rect x="92" y="266" width="60" height="48" rx="6" fill="#5C8FFC"/>
  <rect x="166" y="266" width="34" height="34" rx="6" fill="#1e2b4a"/>
  <circle cx="200" cy="334" r="9" fill="#3b82f6"/>
  <path d="M196 334 l3 3 6 -7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(40,372)">
    <rect width="240" height="76" rx="11" fill="#13223f"/>
    <text x="120" y="32" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#6f9dff">Focus that window</text>
    <text x="120" y="56" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#a9b6cf">no jump — you stay put</text>
  </g>

  <!-- Card B: launch -->
  <g filter="url(#sh)"><rect x="334" y="174" width="252" height="296" rx="16" fill="#0e1730"/></g>
  <rect x="334" y="174" width="252" height="50" rx="16" fill="#13223f"/>
  <rect x="334" y="208" width="252" height="16" fill="#13223f"/>
  <text x="460" y="205" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6f9dff">Not running anywhere?</text>
  <rect x="374" y="246" width="172" height="104" rx="9" fill="#0c1322" stroke="#1e2b4a"/>
  <text x="460" y="304" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#6c7c9c">(empty desktop)</text>
  <g transform="translate(340,372)">
    <rect width="240" height="76" rx="11" fill="#13223f"/>
    <text x="120" y="32" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#6f9dff">Launch it here</text>
    <text x="120" y="56" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#a9b6cf">first window lands here</text>
  </g>

  <!-- Card C: new window -->
  <g filter="url(#sh)"><rect x="634" y="174" width="252" height="296" rx="16" fill="#0e1730"/></g>
  <rect x="634" y="174" width="252" height="50" rx="16" fill="#13223f"/>
  <rect x="634" y="208" width="252" height="16" fill="#13223f"/>
  <text x="760" y="205" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6f9dff">Running only elsewhere?</text>
  <rect x="674" y="246" width="80" height="104" rx="9" fill="#0c1322" stroke="#1e2b4a"/>
  <rect x="690" y="266" width="48" height="40" rx="6" fill="#24345a"/>
  <text x="714" y="338" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#6c7c9c">other</text>
  <rect x="766" y="246" width="80" height="104" rx="9" fill="#0c1322" stroke="#3b82f6" stroke-width="2"/>
  <rect x="782" y="266" width="48" height="40" rx="6" fill="#5C8FFC"/>
  <text x="806" y="338" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#6f9dff">here</text>
  <path d="M756 296 h12 m-6 -5 l6 5 -6 5" stroke="#6f9dff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(640,372)">
    <rect width="240" height="76" rx="11" fill="#13223f"/>
    <text x="120" y="32" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#6f9dff">New window here</text>
    <text x="120" y="56" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#a9b6cf">via a per-app strategy</text>
  </g>

  <text x="460" y="500" text-anchor="middle" font-family="'Instrument Sans','Instrument Sans Variable',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#a9b6cf">The app always opens on the desktop in front of you.</text>
</svg>
